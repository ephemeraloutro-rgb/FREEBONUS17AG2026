  .wrap{max-width:820px;margin:0 auto}
  .glass{
    background:var(--gelap); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border:1px solid rgba(255,215,0,.35); border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.55);
  }
  header{text-align:center;padding:20px 14px;margin-bottom:16px}
  h1{
    margin:0; font-size:clamp(1.2rem,5vw,2.1rem); font-weight:900; letter-spacing:.5px;
    color:var(--emas); text-shadow:0 0 12px rgba(255,215,0,.8),0 0 30px rgba(255,0,0,.5);
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  }
  .flag{width:44px;height:30px;border-radius:4px;flex:0 0 auto;
    background:linear-gradient(#FF0000 0 50%, #fff 50% 100%);
    box-shadow:0 0 14px rgba(255,255,255,.5); animation:wave 2s ease-in-out infinite}
  @keyframes wave{0%,100%{transform:rotate(-6deg) skewY(-3deg)}50%{transform:rotate(6deg) skewY(3deg)}}
  .sub{margin:10px 0 0;font-weight:800;color:#fff;letter-spacing:2px;
    text-shadow:0 0 10px #fff,0 0 24px var(--merah);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  section{padding:18px;margin-bottom:16px}
  .label{color:var(--hijau);font-weight:700;text-shadow:0 0 8px rgba(57,255,20,.7);margin-bottom:8px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  input[type=text]{
    flex:1 1 200px;min-width:0;padding:13px 14px;border-radius:12px;color:#fff;
    background:rgba(0,0,0,.6);border:2px solid var(--hijau);outline:none;font-size:1rem;
    box-shadow:0 0 12px rgba(57,255,20,.25)}
  input[type=text]:focus{border-color:var(--emas);box-shadow:0 0 14px rgba(255,215,0,.45)}
  input::placeholder{color:#8a8a8a}
  .note{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.88rem;font-weight:700;
    color:#fff;background:rgba(255,0,0,.18);border:1px solid rgba(255,0,0,.6);
    text-shadow:0 0 8px rgba(255,0,0,.6)}
  .note.on{display:block}
  .btn{cursor:pointer;border:none;font-weight:900;border-radius:12px;transition:.2s;letter-spacing:1px;
    font-family:inherit}
  .btn:focus-visible{outline:3px solid var(--emas);outline-offset:2px}
  .btn-hapus{padding:13px 22px;background:linear-gradient(180deg,#FFD700,#c9a200);color:#241c00}
  .btn-hapus:hover{filter:brightness(1.15);transform:translateY(-2px);box-shadow:0 0 18px rgba(255,215,0,.7)}
  .wheel-area{display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;overflow:hidden;

  .wheel-area>*{position:relative;z-index:1}
  .wheel-box{position:relative;width:min(88vw,360px);aspect-ratio:1}
  .wheel-box::before{content:"";position:absolute;inset:-9%;border-radius:50%;z-index:0;
    background:radial-gradient(circle,rgba(255,215,0,.35),rgba(255,215,0,0) 70%);filter:blur(6px);
    animation:aura 3s ease-in-out infinite}
  @keyframes aura{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
  .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:3;
    width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;
    border-top:30px solid var(--emas);filter:drop-shadow(0 0 8px rgba(255,215,0,.9))}
  #wheel{display:block;width:100%;height:100%;border-radius:50%;border:8px solid var(--emas);
    box-shadow:0 0 30px rgba(255,215,0,.6),inset 0 0 30px rgba(0,0,0,.6);
    transition:transform 4s cubic-bezier(.15,.85,.2,1);will-change:transform}
  .hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;
    width:23%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 35% 30%,#fff6c2,#FFD700 45%,#b58900);
    color:#3a2c00;font-weight:900;font-size:clamp(.7rem,2.6vw,1rem);border:3px solid #fff;
    box-shadow:0 0 18px rgba(255,215,0,.9);cursor:pointer;padding:0;line-height:1}
  .btn-spin{width:100%;max-width:360px;padding:16px;font-size:1.05rem;color:#3a2c00;
    background:linear-gradient(90deg,#b58900,#FFD700,#fff3a8,#FFD700,#b58900);
    box-shadow:0 0 24px rgba(255,215,0,.55)}
  .btn-spin:hover{filter:brightness(1.1);transform:translateY(-2px)}
  .btn-spin:disabled{opacity:.55;cursor:not-allowed;transform:none;filter:none}
  .sound{display:flex;align-items:center;gap:8px;font-size:.9rem;color:#eee;cursor:pointer}
  .sound input{width:18px;height:18px;accent-color:#FFD700}
  .feed h2{margin:0 0 12px;font-size:1rem;color:var(--emas);letter-spacing:1px}
  .claim{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:11px 13px;margin-bottom:9px;border-radius:12px;background:rgba(255,255,255,.06);
    border-left:4px solid var(--merah);animation:slide .5s ease}
  .claim b{color:#fff}.claim span{color:var(--emas);font-weight:900}
  @keyframes slide{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;place-items:center;padding:20px;z-index:9}
  .modal.on{display:grid}
  .modal-card{max-width:360px;width:100%;text-align:center;padding:28px 22px;animation:slide .4s}
  .modal-card h3{margin:0;color:var(--emas);font-size:1.4rem;text-shadow:0 0 14px rgba(255,215,0,.8)}
  .prize{font-size:2.1rem;font-weight:900;color:#fff;margin:14px 0;text-shadow:0 0 16px var(--merah)}
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important}
    #wheel{transition-duration:1.2s}
  }
</style>

<body>
<div class="wrap">
  <header class="glass">
    <h1><i class="flag" aria-hidden="true"></i> BONUS KEMERDEKAAN 17 AGUSTUS 2026 <i class="flag" aria-hidden="true"></i></h1>
    <p class="sub">CLAIM BONUS SEKARANG JUGA!</p>
  </header>

  <section class="glass">
    <div class="label" id="uidLabel">• MASUKKAN USERID</div>
    <div class="row">
      <input id="uid" type="text" inputmode="text" autocomplete="off" autocapitalize="characters"
             spellcheck="false" maxlength="24" aria-labelledby="uidLabel"
             placeholder="Contoh: CLAIMBONUS11" />
      <button type="button" class="btn btn-hapus" id="clear">HAPUS</button>
    </div>
    <div id="note" class="note" role="alert" aria-live="polite"></div>
  </section>

  <section class="glass wheel-area">
    <div class="wheel-box">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel" width="600" height="600" role="img" aria-label="Roda hadiah bonus kemerdekaan"></canvas>
      <button type="button" class="hub btn" id="hub" aria-label="Putar roda">PUTAR</button>
    </div>
    <button type="button" class="btn btn-spin" id="spin">PUTAR SEKARANG</button>
    <label class="sound"><input type="checkbox" id="snd" checked /> Aktifkan efek suara</label>
  </section>

  <section class="glass feed">
    <h2>• RECENT CLAIM</h2>
    <div id="feed"></div>
  </section>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="modal-card glass">
    <h3 id="mtitle">SELAMAT! 🎉</h3>
    <div class="prize" id="prize">Rp0</div>
    <p id="pmsg">Bonus kemerdekaan berhasil didapatkan.</p>
    <button type="button" class="btn btn-spin" id="closeModal">TUTUP</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var PRIZES = [30000,40000,50000,60000,70000,80000,90000,100000,200000,300000];
  var COLORS = ['#FF0000','#FFFFFF','#00A650','#FFD700','#0057B8'];
  var SPIN_MS = 4000;
  var KEY = 'claim_kemerdekaan_2026';

  var $ = function(id){ return document.getElementById(id); };
  var rp = function(n){ return 'Rp' + Number(n).toLocaleString('id-ID'); };

  var cv = $('wheel');
  var ctx = cv && cv.getContext ? cv.getContext('2d') : null;
  var uidEl = $('uid'), noteEl = $('note'), spinBtn = $('spin'), hubBtn = $('hub');
  var sndEl = $('snd'), modal = $('modal');
  var N = PRIZES.length, R = 300, seg = (2 * Math.PI) / N;

  /* ---------- RODA ---------- */
  function draw(){
    if(!ctx) return;
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=0;i<N;i++){
      var a0 = i*seg - Math.PI/2 - seg/2, a1 = a0 + seg;
      var color = COLORS[i % COLORS.length];
      ctx.beginPath(); ctx.moveTo(R,R); ctx.arc(R,R,R-6,a0,a1); ctx.closePath();
      ctx.fillStyle = color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,215,0,.9)'; ctx.lineWidth = 3; ctx.stroke();

      ctx.save(); ctx.translate(R,R); ctx.rotate(a0 + seg/2);
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillStyle = (color === '#FFFFFF' || color === '#FFD700') ? '#111' : '#fff';
      ctx.font = 'bold 28px "Segoe UI", Arial, sans-serif';
      ctx.fillText(rp(PRIZES[i]), R - 28, 0);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(R,R,R-6,0,2*Math.PI);
    ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 10; ctx.stroke();
  }
  draw();

  /* ---------- SUARA ---------- */
  var audioCtx = null;
  function beep(freq, dur){
    if(!sndEl || !sndEl.checked) return;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      if(!audioCtx) audioCtx = new AC();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'triangle'; o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      var t = audioCtx.currentTime;
      g.gain.setValueAtTime(0.15, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.start(t); o.stop(t + dur);
    }catch(e){ /* audio tidak tersedia */ }
  }

  /* ---------- PENYIMPANAN KLAIM ---------- */
  function claimed(){
    try{
      var raw = localStorage.getItem(KEY);
      var obj = raw ? JSON.parse(raw) : {};
      return (obj && typeof obj === 'object') ? obj : {};
    }catch(e){ return {}; }
  }
  function saveClaim(u, v){
    try{
      var c = claimed();
      c[u] = { v:v, t:new Date().toISOString() };
      localStorage.setItem(KEY, JSON.stringify(c));
    }catch(e){ /* storage penuh / diblokir */ }
  }

  function normUid(){
    return (uidEl.value || '').trim().replace(/\s+/g,'').toUpperCase();
  }

  var spinning = false, rot = 0;

  function setNote(msg){
    if(msg){ noteEl.textContent = msg; noteEl.classList.add('on'); }
    else { noteEl.textContent = ''; noteEl.classList.remove('on'); }
  }

  function checkUid(){
    var u = normUid();
    var c = claimed();
    if(u && Object.prototype.hasOwnProperty.call(c, u)){
      setNote('USERID ' + u + ' sudah pernah klaim ' + rp(c[u].v) + '. Bonus hanya 1x per USERID.');
      spinBtn.disabled = true;
      return false;
    }
    setNote('');
    spinBtn.disabled = spinning || u.length === 0;
    return u.length > 0;
  }

  /* ---------- PUTAR ---------- */
  var spinTimer = null;
  function spin(){
    if(spinning) return;
    var uid = normUid();
    if(!uid){ setNote('Silakan masukkan USERID terlebih dahulu.'); uidEl.focus(); return; }
    if(!checkUid()) return;

    spinning = true;
    spinBtn.disabled = true;
    hubBtn.disabled = true;

    var idx = Math.floor(Math.random() * N);
    var step = 360 / N;
    /* offset acak di dalam segmen supaya berhenti tidak selalu tepat di tengah */
    var jitter = (Math.random() - 0.5) * (step * 0.6);
    var current = ((rot % 360) + 360) % 360;
    var target = ((360 - idx * step + jitter) % 360 + 360) % 360;
    rot += 360 * 6 + ((target - current) + 360) % 360;
    cv.style.transform = 'rotate(' + rot + 'deg)';
    beep(660, 0.25);

    clearTimeout(spinTimer);
    spinTimer = setTimeout(function(){
      beep(880, 0.5);
      saveClaim(uid, PRIZES[idx]);
      $('prize').textContent = rp(PRIZES[idx]);
      $('pmsg').textContent = 'Selamat ' + uid + ', bonus kemerdekaan ' + rp(PRIZES[idx]) +
                              ' berhasil diklaim! Klaim hanya berlaku 1x per USERID.';
      modal.classList.add('on');
      $('closeModal').focus();
      spinning = false;
      hubBtn.disabled = false;
      checkUid();
    }, SPIN_MS + 120);
  }

  uidEl.addEventListener('input', checkUid);
  uidEl.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); spin(); }
  });
  spinBtn.addEventListener('click', spin);
  hubBtn.addEventListener('click', spin);
  $('clear').addEventListener('click', function(){
    uidEl.value = '';
    checkUid();
    uidEl.focus();
  });

  function closeModal(){ modal.classList.remove('on'); }
  $('closeModal').addEventListener('click', closeModal);
  modal.addEventListener('click', function(e){ if(e.target === modal) closeModal(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && modal.classList.contains('on')) closeModal();
  });

  checkUid(); /* status tombol benar sejak halaman dibuka */

  /* ---------- RECENT CLAIM ---------- */
  var NAMES = ['ANDIKA***','BUDI***','CAKRA***','DIPO***','ELANG***','FAJAR***','GARUDA***',
               'HANG***','INDRA***','JAYA***','KUSUMA***','LASKAR***','MERDEKA***','NUSA***',
               'OMBAK***','PEJUANG***','RAJ***','SANG***','TEUKU***','WIRA***','ZAMRUD***'];
  var FEED = PRIZES.slice(0, 8);
  var feedEl = $('feed');
  var items = [];

  function make(usedLetters){
    var pool = NAMES.filter(function(n){ return usedLetters.indexOf(n.charAt(0)) === -1; });
    if(!pool.length) pool = NAMES;
    var n = pool[Math.floor(Math.random() * pool.length)];
    return { u: n + Math.floor(Math.random() * 90 + 10), v: FEED[Math.floor(Math.random() * FEED.length)] };
  }
  function letters(list){ return list.map(function(i){ return i.u.charAt(0); }); }

  function render(){
    var frag = document.createDocumentFragment();
    items.forEach(function(it){
      var d = document.createElement('div');
      d.className = 'claim';
      var b = document.createElement('b'); b.textContent = it.u;
      var s = document.createElement('span'); s.textContent = rp(it.v);
      d.appendChild(b); d.appendChild(s);
      frag.appendChild(d);
    });
    feedEl.textContent = '';
    feedEl.appendChild(frag);
  }

  for(var i = 0; i < 4; i++) items.push(make(letters(items)));
  render();

  setInterval(function(){
    if(document.hidden) return;
    var keep = items.slice(0, 3);
    items = [make(letters(keep))].concat(keep);
    render();
  }, 5000);
})();
</script>
</body>
</html>
